[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "daychi-knowledge"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["daychi_contracts*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
